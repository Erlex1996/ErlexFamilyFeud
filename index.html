<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu Family Feud</title>

<style>
body {
    font-family: 'Copperplate', sans-serif;
    background: url('sfondo.jpg') no-repeat center center fixed;
    background-size: cover;
    margin: 0;
    padding: 0;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.menu {
    background: rgba(0,0,0,0.7);
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 0 25px rgba(0,0,0,0.7);
    text-align: center;
    width: min(95vw, 1000px);
}

.menu h1 {
    font-family: 'Candara', cursive;
    font-size: 3em;
    margin-bottom: 40px;
    text-shadow: 2px 2px 8px #000;
}

.squadre-container {
    display: flex;
    justify-content: center;
    gap: 60px;
    flex-wrap: wrap;
    margin-bottom: 30px;
}

.squadra { width: 300px; }

.squadra-inner {
    background: rgba(255,255,255,0.95);
    color: #000;
    border-radius: 20px;
    padding: 30px;
    box-sizing: border-box;
}

input[type=text] {
    padding: 8px;
    font-size: 18px;
    width: 90%;
    max-width: 220px;
    border-radius: 6px;
    border: 1px solid #888;
}

.color-selezione,
.avatar-selezione {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 20px;
}

.color-selezione div {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    border: 3px solid #fff;
}

.avatar-selezione img {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    border: 3px solid black;
    object-fit: cover;
    background: #eee;
    cursor: pointer;
    transition: 0.2s;
}

.avatar-selezionato {
    transform: scale(1.1);
    border: 4px solid #28a745 !important;
}

.avatar-bloccato { opacity: 0.25; }

button {
    padding: 10px 22px;
    font-size: 16px;
    cursor: pointer;
    border: none;
    border-radius: 6px;
    background: #28a745;
    color: white;
}

button:disabled {
    background: #777;
    cursor: not-allowed;
    opacity: 0.6;
}

/* === GLOW ANIMAZIONE AVVIO === */
@keyframes glowPulse {
    0% {
        box-shadow: 0 0 5px #28a745;
    }
    50% {
        box-shadow: 0 0 20px #28a745, 0 0 40px #2ecc71;
    }
    100% {
        box-shadow: 0 0 5px #28a745;
    }
}

.glow-attivo {
    animation: glowPulse 1.5s infinite;
    transform: scale(1.05);
}


.carosello-btn {
    background: #007bff;
    font-weight: bold;
}
</style>
</head>
<body>

<div class="menu">
<h1>Menu Squadre</h1>

<div class="squadre-container">

<div class="squadra">
<div class="squadra-inner">
<h2>Squadra 1</h2>
Nome:<br>
<input type="text" id="nome1" value="Squadra 1">

<br><br>Colore:
<div class="color-selezione">
<button class="carosello-btn" onclick="prevColore(1)">&lt;</button>
<div id="coloreMostrato1"></div>
<button class="carosello-btn" onclick="nextColore(1)">&gt;</button>
</div>

Avatar:
<div class="avatar-selezione">
<button class="carosello-btn" onclick="prevAvatar(1)">&lt;</button>
<img id="avatarMostrato1" onclick="toggleAvatar(1)">
<button class="carosello-btn" onclick="nextAvatar(1)">&gt;</button>
</div>
</div>
</div>

<div class="squadra">
<div class="squadra-inner">
<h2>Squadra 2</h2>
Nome:<br>
<input type="text" id="nome2" value="Squadra 2">

<br><br>Colore:
<div class="color-selezione">
<button class="carosello-btn" onclick="prevColore(2)">&lt;</button>
<div id="coloreMostrato2"></div>
<button class="carosello-btn" onclick="nextColore(2)">&gt;</button>
</div>

Avatar:
<div class="avatar-selezione">
<button class="carosello-btn" onclick="prevAvatar(2)">&lt;</button>
<img id="avatarMostrato2" onclick="toggleAvatar(2)">
<button class="carosello-btn" onclick="nextAvatar(2)">&gt;</button>
</div>
</div>
</div>

</div>
<button id="avviaBtn" onclick="avviaGioco()" disabled>Avvia Gioco</button>
</div>

<script>
const avatarLista = ['dino.png','wolf.png','cat.png','spider.png','eagle.png','turtle.png','mouse.png','hat.png','car.png'];
let avatarIndex = {1:0,2:1};
let avatarSelezionato = {1:null,2:null};

function avatarCorrente(s){
  return avatarLista[avatarIndex[s]];
}

function mostraAvatar(s){
  const img=document.getElementById('avatarMostrato'+s);
  const avatar=avatarCorrente(s);
  img.src='avatars/'+avatar;
  img.classList.remove('avatar-selezionato','avatar-bloccato');

  const altro = (s===1)?2:1;
  if(avatarSelezionato[s]===avatar) img.classList.add('avatar-selezionato');
  if(avatarSelezionato[altro]===avatar) img.classList.add('avatar-bloccato');
}

function nextAvatar(s){
  avatarIndex[s]=(avatarIndex[s]+1)%avatarLista.length;
  mostraAvatar(1);
  mostraAvatar(2);
}

function prevAvatar(s){
  avatarIndex[s]=(avatarIndex[s]-1+avatarLista.length)%avatarLista.length;
  mostraAvatar(1);
  mostraAvatar(2);
}

function toggleAvatar(s){
  const avatar=avatarCorrente(s);
  const altro=(s===1)?2:1;
  if(avatarSelezionato[altro]===avatar) return;

  avatarSelezionato[s]=(avatarSelezionato[s]===avatar)?null:avatar;

  mostraAvatar(1);
  mostraAvatar(2);
  controllaAvvio();
}

function controllaAvvio(){
  const btn = document.getElementById('avviaBtn');

  if(avatarSelezionato[1] && avatarSelezionato[2]){
    btn.disabled = false;
    btn.classList.add('glow-attivo');
  } else {
    btn.disabled = true;
    btn.classList.remove('glow-attivo');
  }
}


const colori=['#e74c3c','#e67e22','#f1c40f','#2ecc71','#1abc9c','#3498db','#9b59b6','#fd79a8','#a0522d','#7f8c8d'];
let coloreIndex={1:0,2:5};
let coloreScelto={1:colori[0],2:colori[5]};

function mostraColore(s){
  const colore=colori[coloreIndex[s]];
  const divColore=document.getElementById('coloreMostrato'+s);
  divColore.style.background=colore;
  divColore.style.border='3px solid #fff';
  divColore.style.borderRadius='50%';
  coloreScelto[s]=colore;
}

function nextColore(s){
  coloreIndex[s]=(coloreIndex[s]+1)%colori.length;
  mostraColore(s);
}

function prevColore(s){
  coloreIndex[s]=(coloreIndex[s]-1+colori.length)%colori.length;
  mostraColore(s);
}

function avviaGioco(){
  if(!(avatarSelezionato[1] && avatarSelezionato[2])) return;

  localStorage.setItem('nome1',document.getElementById('nome1').value);
  localStorage.setItem('colore1',coloreScelto[1]);
  localStorage.setItem('avatar1',avatarSelezionato[1]);

  localStorage.setItem('nome2',document.getElementById('nome2').value);
  localStorage.setItem('colore2',coloreScelto[2]);
  localStorage.setItem('avatar2',avatarSelezionato[2]);

  window.location.href='ErlexFamilyFeud.html';
}

mostraAvatar(1);
mostraAvatar(2);
mostraColore(1);
mostraColore(2);
</script>

</body>
</html>
